[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jobflow-calendar"
version = "0.1.0"
description = "Deterministic selected-month scheduler for Korean job-search planning"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "gradio>=5.20,<7",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"] # Architecture requires enums to subclass both str and Enum.

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
